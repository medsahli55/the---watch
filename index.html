<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Watch — Daily Agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --hull:#11161a;
    --hull-2:#161d22;
    --plate:#1c252b;
    --plate-2:#212b32;
    --brass:#b8935a;
    --brass-hi:#dcb877;
    --brass-dark:#7d5d38;
    --cream:#ece2cd;
    --verdigris:#3e6b62;
    --verdigris-hi:#5b968a;
    --amber:#d98e3f;
    --ink:#a9a196;
    --ink-dim:#726b60;
    --danger:#a85a44;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, rgba(184,147,90,0.06), transparent 45%),
      radial-gradient(ellipse at 90% 110%, rgba(62,107,98,0.08), transparent 50%),
      var(--hull);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }
  ::selection{background:var(--brass-dark); color:var(--cream);}

  /* ---------- Lock screen ---------- */
  #lock{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:var(--hull);
  }
  #lock.hidden{display:none;}
  .lock-plate{
    background:var(--plate);
    border:1px solid var(--brass-dark);
    border-radius:10px;
    padding:36px 32px;
    width:min(320px, 88vw);
    text-align:center;
    box-shadow:0 0 0 1px rgba(184,147,90,0.08), 0 20px 50px rgba(0,0,0,0.5);
  }
  .lock-plate h2{
    font-family:'Fraunces', serif; font-weight:600; letter-spacing:0.04em;
    color:var(--brass-hi); margin:0 0 6px;
  }
  .lock-plate p{font-size:12.5px; color:var(--ink-dim); margin:0 0 20px;}
  #lock-input{
    width:100%; padding:12px 14px; font-size:20px; letter-spacing:0.3em;
    text-align:center; font-family:'IBM Plex Mono', monospace;
    background:var(--hull-2); border:1px solid var(--brass-dark); border-radius:6px;
    color:var(--cream); outline:none; margin-bottom:14px;
  }
  #lock-input:focus{border-color:var(--brass);}
  .lock-btn{
    width:100%; padding:11px; border-radius:6px; border:1px solid var(--brass-dark);
    background:linear-gradient(180deg, var(--plate-2), var(--plate));
    color:var(--brass-hi); font-family:'IBM Plex Mono', monospace; font-size:13px;
    letter-spacing:0.08em; cursor:pointer;
  }
  .lock-btn:hover{border-color:var(--brass);}
  #lock-err{color:var(--danger); font-size:12px; height:16px; margin-top:8px;}
  #lock-skip{margin-top:14px; font-size:11px; color:var(--ink-dim); cursor:pointer; text-decoration:underline; text-underline-offset:2px;}

  /* ---------- Header / Chronometer ---------- */
  header{
    padding:34px 20px 22px;
    text-align:center;
    border-bottom:1px solid rgba(184,147,90,0.15);
  }
  .brandline{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.35em;
    color:var(--ink-dim); text-transform:uppercase; margin-bottom:14px;
  }
  h1.title{
    font-family:'Fraunces', serif; font-weight:700; font-optical-sizing:auto;
    font-size:clamp(28px, 7vw, 46px); letter-spacing:0.02em;
    color:var(--brass-hi); margin:0 0 20px;
    text-shadow:0 1px 0 rgba(0,0,0,0.6), 0 0 30px rgba(184,147,90,0.12);
  }
  .chrono-wrap{display:flex; align-items:center; justify-content:center; gap:22px; flex-wrap:wrap;}
  .chrono{
    width:118px; height:118px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--plate-2), var(--plate) 70%);
    border:3px solid var(--brass-dark);
    box-shadow:inset 0 0 14px rgba(0,0,0,0.6), 0 0 0 6px var(--hull-2), 0 0 0 7px var(--brass-dark);
    position:relative;
  }
  .chrono .tick{position:absolute; width:2px; height:8px; background:var(--brass); left:50%; top:4px; transform-origin:1px 55px;}
